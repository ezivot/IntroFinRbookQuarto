project:
  type: book

book:
  title: "Introduction to Computational Finance and Financial Econometrics with R"
  author: "Eric Zivot"
  date: last-modified
  chapters:
    - index.qmd
    - 01-ReturnCalculations-new.qmd
    - 02-probReview-new.qmd
    - 03-matrixReview-new.qmd
    - 04-timeSeriesConcepts-new.qmd
    - 05-descriptiveStatistics-new.qmd
    - references.qmd

bibliography: [book.bib, packages.bib]

execute:
  engine: knitr
  message: false
  warning: false
  fig-show: hold

knitr:
  opts_chunk:
    comment: "#>"
    collapse: true

format:
  html:
    theme: cosmo
  pdf:
    documentclass: scrreprt
    fontsize: 11pt
    geometry: margin=1in
    linestretch: 1.4
    

editor: source

